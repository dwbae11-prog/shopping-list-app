<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>쇼핑 리스트</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <h1>🛒 쇼핑 리스트</h1>

    <form id="add-form">
      <input type="text" id="item-input" placeholder="살 물건을 입력하세요" autocomplete="off" />
      <button type="submit">추가</button>
    </form>

    <ul id="item-list"></ul>

    <p id="empty-message" class="empty-message">아직 담은 물건이 없어요. 위에서 추가해 보세요!</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
